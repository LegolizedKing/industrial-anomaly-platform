services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: anomaly
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -Atqc 'SELECT count(*) FROM anomaly_alerts'"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://anomaly:local-demo-password@db:5432/anomaly
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  pgdata:
