name: Container demo
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify dashboard and saved alert
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused http://127.0.0.1:8000/ -o dashboard-response.html
          cmp dashboard.html dashboard-response.html
          python3 demo.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down
